# Builds a complete dsh-go APK on a Linux runner: the bundled runtime
# (runtime/out/<abi>, which only builds on x86_64 Linux) plus the Flutter APK
# that packages it.
#
#   gh workflow run build-apk.yml --ref main -f flavor=arm64
#   gh run download <run-id> -n dsh-go-apk-arm64 -D out
#
# This complements runtime.yml (runtime only, for carrying a matching runtime
# into a local build) and docs/release.md (the signed release flow).
name: Build APK

on:
  # The first run fires when this file lands on a branch, so the workflow is
  # usable before it reaches the default branch.
  push:
    paths: ['.github/workflows/build-apk.yml']
  workflow_dispatch:
    inputs:
      flavor:
        description: 'ABI flavor to build'
        type: choice
        options: [arm64, x64]
        default: arm64
      build_name:
        description: 'versionName override (empty = app/pubspec.yaml)'
        required: false
        default: ''
      app_id_suffix:
        description: 'Package id suffix, e.g. .fork, to install beside the official app'
        required: false
        default: ''

permissions:
  contents: write # the APK is also attached to a draft release below

concurrency:
  group: build-apk-${{ github.ref }}-${{ inputs.flavor }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.7
  TZ: Asia/Shanghai
  # The Aliyun mirrors are slow and unreliable from a US runner.
  DSH_MAVEN_MIRRORS: 0
  # Public build: never embed the beta channel token.
  DSH_BETA_TOKEN_FILE: ''
  # Must match flutter.ndkVersion in the pinned Flutter SDK.
  NDK_VERSION: 28.2.13676358

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      # A push run carries no inputs, so fall back to the ARMv8 phone build.
      FLAVOR: ${{ inputs.flavor || 'arm64' }}
      BUILD_NAME: ${{ inputs.build_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # bash, git, curl, tar, unzip, xz, python3, zstd, file, and gpgv are what
      # runtime/build-runtime.sh needs on top of the runner image.
      - name: Install runtime build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zstd xz-utils file gpgv

      # Downloads are verified by hash on every run, so a stale cache is harmless.
      - name: Restore the download cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: runtime/.cache
          key: runtime-downloads-v1-${{ hashFiles('runtime/build-runtime.sh', 'runtime/locks/**') }}
          restore-keys: runtime-downloads-v1-

      - name: Build the bundled runtime
        run: |
          echo "flavor: $FLAVOR"
          case "$FLAVOR" in
            arm64) runtime/build-runtime.sh arm64-v8a ;;
            x64) runtime/build-runtime.sh x86_64 ;;
            *) echo "unknown flavor: $FLAVOR" >&2; exit 1 ;;
          esac

      - name: Save the download cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: runtime/.cache
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Flutter plugins and local.properties
        working-directory: app
        run: |
          flutter pub get --enforce-lockfile
          printf 'sdk.dir=%s\nflutter.sdk=%s\n' "$ANDROID_HOME" "$FLUTTER_ROOT" > android/local.properties

      # Gradle needs the NDK for the pinned ndkVersion even though no native code
      # is compiled here, and runtime/tawcroot/build.py prefers ANDROID_NDK_HOME -
      # which the runner image points at its own NDK. Both must see the pinned one.
      - name: Android NDK ${{ env.NDK_VERSION }}
        run: |
          if [ ! -d "$ANDROID_HOME/ndk/$NDK_VERSION" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION"
          fi
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          grep '^Pkg.Revision' "$ANDROID_HOME/ndk/$NDK_VERSION/source.properties"

      # A runner starts without a debug keystore, so every build would otherwise
      # One signing identity for every build of this fork. A runner starts
      # without a keystore, so each build used to sign with a fresh key and the
      # next one could not be installed over it (INSTALL_FAILED_UPDATE_INCOMPATIBLE).
      #
      # The key comes from repository secrets, not a debug keystore: a key that
      # never changes is what makes "install this build over the last one" work,
      # and a release key is what stops anyone else signing as this app. Without
      # the secrets (a plain clone, a pull request from a fork) the build falls
      # back to the debug key rather than failing.
      - name: Install the signing identity
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "no signing secrets; this build falls back to the debug key"
            exit 0
          fi
          # storeFile is resolved against the module directory (app/android/app),
          # not the root project: putting the keystore anywhere else makes Gradle
          # fail at :app:validateSigningArm64Release.
          mkdir -p app/android/app/keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > app/android/app/keystore/dsh-fork.jks
          cat > app/android/key.properties <<EOF
          storeFile=keystore/dsh-fork.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          ls -l app/android/app/keystore/dsh-fork.jks
          echo "signing with key alias $KEY_ALIAS"

      # Installs beside the official app instead of trying to replace it: a fork
      # signed with another key can never overwrite it, and uninstalling would
      # take the official app's data with it.
      - name: Install beside the official app
        if: inputs.app_id_suffix != ''
        run: |
          echo "package id: io.github.ccch1mneyyy.dsh_app${{ inputs.app_id_suffix }}"
          printf '\ndshAppIdSuffix=%s\n' "${{ inputs.app_id_suffix }}" >> app/android/gradle.properties

      - name: Build the APK
        run: |
          args=(-f "$FLAVOR" --keep-daemon)
          if [ -n "$BUILD_NAME" ]; then
            args+=(--build-name "$BUILD_NAME")
          fi
          bash tooling/build-apk.sh "${args[@]}"

      - name: Report the artifact
        run: |
          apk=$(ls -1 app/build/app/outputs/flutter-apk/*.apk | head -n 1)
          echo "artifact: $apk"
          ls -lh "$apk"
          sha256sum "$apk"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dsh-go-apk-${{ inputs.flavor || 'arm64' }}
          path: |
            app/build/app/outputs/flutter-apk/*.apk
            app/build/app/outputs/flutter-apk/*.sha1
          retention-days: 14
          if-no-files-found: error

      # A release asset downloads far faster than an Actions artifact for anyone
      # behind a slow proxy. Draft, so a CI build never looks like a release.
      - name: Attach the APK to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="ci-apk-${FLAVOR}-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "dsh-go ${FLAVOR} APK · run ${GITHUB_RUN_NUMBER}" \
            --notes "Debug-signed sideload build from ${GITHUB_SHA}, produced by .github/workflows/build-apk.yml. Not an official release; the bundled runtime is included." \
            app/build/app/outputs/flutter-apk/*.apk
          echo "draft release: $tag"
